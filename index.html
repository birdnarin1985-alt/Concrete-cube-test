<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BODHI-PANYA ENGINE // RANDOMIZED RE-ASSEMBLY (v5.3D)</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --site-yellow: #f39c12;
            --site-dark: #07090c;
            --concrete-gray: #95a5a6;
            --hazard-red: #e74c3c;
            --causality-cyan: #00ffcc;
            --text-main: #f5f6fa;
        }

        body {
            margin: 0;
            background: var(--site-dark);
            font-family: 'Sarabun', sans-serif;
            color: var(--text-main);
            overflow: hidden;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .engine-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 30%, #161f30 0%, #07090c 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <div class="engine-container">
        <canvas id="panyaCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('panyaCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class BodhiNode {
            constructor(x, y, z, type) {
                this.ox = x; this.oy = y; this.oz = z; // Home Position ปัจจุบัน
                this.targetX = x; this.targetY = y; this.targetZ = z; // ตำแหน่งเป้าหมายใหม่หลังรีเซ็ต
                this.x = x; this.y = y; this.z = z;
                this.vx = 0; this.vy = 0; this.vz = 0;
                this.type = type; // 'rock', 'sand', 'paste', 'root'
                
                if (type === 'rock') {
                    this.radius = 5.5 + Math.random() * 2.5;
                    this.color = '#7f8c8d'; // หิน (4 ส่วน)
                } else if (type === 'sand') {
                    this.radius = 2.2 + Math.random() * 1.0;
                    this.color = '#d35400'; // ทราย (2 ส่วน)
                } else if (type === 'root') {
                    this.radius = 7.0;
                    this.color = '#f39c12';
                } else {
                    this.radius = 0.9;
                    this.color = '#bdc3c7'; // ซีเมนต์เพสต์ (1 ส่วน)
                }

                this.next = null;
                this.isBroken = false;
            }

            // สุ่มตำแหน่งใหม่ทุกครั้งที่ประกอบร่าง (Randomized Re-crystallization)
            randomizeNewHome() {
                let size = 85;
                this.targetX = (Math.random() - 0.5) * size;
                this.targetY = (Math.random() - 0.5) * size;
                this.targetZ = (Math.random() - 0.5) * size;
                this.vx = 0; this.vy = 0; this.vz = 0;
                this.isBroken = false;
            }

            updateHome() {
                this.ox = this.targetX;
                this.oy = this.targetY;
                this.oz = this.targetZ;
            }
        }

        let rootNode = null;
        let allNodes = [];
        let idleAngle = 0;
        let dynamicScale = 1.0;
        let isBrokenState = false;

        function buildBodhiTree() {
            allNodes = [];
            let size = 90;
            let step = 15;

            rootNode = new BodhiNode(0, -size/2, 0, 'root');
            allNodes.push(rootNode);

            let lastCreated = rootNode;

            for (let x = -size/2; x <= size/2; x += step) {
                for (let y = -size/2; y <= size/2; y += step) {
                    for (let z = -size/2; z <= size/2; z += step) {
                        if (x === 0 && y === -size/2 && z === 0) continue;

                        let roll = Math.random() * 7;
                        let type = 'paste';
                        if (roll < 4) type = 'rock';
                        else if (roll < 6) type = 'sand';

                        if (Math.random() > 0.1) {
                            let newNode = new BodhiNode(x, y, z, type);
                            allNodes.push(newNode);

                            lastCreated.next = newNode;
                            lastCreated = newNode;
                        }
                    }
                }
            }
        }

        function computeScaleMatrix() {
            const minDim = Math.min(canvas.width, canvas.height);
            dynamicScale = (minDim / 400) * 0.85;
            return dynamicScale;
        }

        function project(x, y, z, cx, cy) {
            let rad = idleAngle;
            let cos = Math.cos(rad);
            let sin = Math.sin(rad);

            let x1 = x * cos - z * sin;
            let z1 = z * cos + x * sin;
            let y1 = y;

            let scaledX = x1 * dynamicScale;
            let scaledY = y1 * dynamicScale;
            let scaledZ = z1 * dynamicScale;

            let isoX = cx + (scaledX - scaledZ) * 0.707;
            let isoY = cy + (scaledX + scaledZ) * 0.353 + scaledY;

            return { x: isoX, y: isoY };
        }

        function triggerHammerImpact(clickX, clickY) {
            isBrokenState = true;
            let cx = canvas.width / 2;
            let cy = canvas.height / 2;

            allNodes.forEach(node => {
                let dx = node.x * dynamicScale - (clickX - cx);
                let dy = node.y * dynamicScale - (clickY - cy);
                let dist = Math.hypot(dx, dy);

                let powerMultiplier = 16;
                node.vx += (dx / (dist + 5)) * (Math.random() * powerMultiplier + 3) + (Math.random() - 0.5) * 8;
                node.vy += (dy / (dist + 5)) * (Math.random() * powerMultiplier + 3) + (Math.random() - 0.5) * 8;
                node.vz += (Math.random() - 0.5) * 10;
                node.isBroken = true;
            });

            setTimeout(() => {
                reconstituteNewMix();
            }, 3500);
        }

        // สุ่มโครงสร้างใหม่แบบการผสมคอนกรีตใหม่ (Randomized Re-assembly)
        function reconstituteNewMix() {
            allNodes.forEach(node => {
                node.randomizeNewHome();
                node.updateHome();
            });
            isBrokenState = false;
        }

        canvas.addEventListener('click', (e) => {
            if (!isBrokenState) {
                triggerHammerImpact(e.clientX, e.clientY);
            }
        });

        buildBodhiTree();
        computeScaleMatrix();

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let cx = canvas.width / 2;
            let cy = canvas.height / 2;

            if (!isBrokenState) {
                idleAngle += 0.005;
            }

            computeScaleMatrix();

            // 1. Synchronized Particle Shadows (1:1)
            allNodes.forEach(node => {
                let p = project(node.x, node.y, node.z, cx, cy);
                let shadowY = cy + (70 * dynamicScale);
                
                ctx.fillStyle = 'rgba(0, 255, 204, 0.12)';
                ctx.beginPath();
                ctx.arc(p.x, shadowY + (p.y - cy) * 0.2, node.radius * dynamicScale * 0.8, 0, Math.PI * 2);
                ctx.fill();
            });

            // 2. Calculus Dynamics Update (Integration F_spring)
            allNodes.forEach(node => {
                if (isBrokenState) {
                    node.x += node.vx;
                    node.y += node.vy;
                    node.z += node.vz;
                    node.vy += 0.35;
                    node.vx *= 0.94;
                    node.vy *= 0.94;

                    let p = project(node.x, node.y, node.z, cx, cy);
                    if (p.x < 20 || p.x > canvas.width - 20) node.vx *= -0.3;
                    if (p.y < 20 || p.y > canvas.height - 20) node.vy *= -0.3;
                } else {
                    node.x += (node.ox - node.x) * 0.1;
                    node.y += (node.oy - node.y) * 0.1;
                    node.z += (node.oz - node.z) * 0.1;
                }
            });

            // 3. Render Bodhi Tree Linked List
            let curr = rootNode;
            while (curr && curr.next) {
                let p1 = project(curr.x, curr.y, curr.z, cx, cy);
                let p2 = project(curr.next.x, curr.next.y, curr.next.z, cx, cy);

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = isBrokenState ? 'rgba(231, 76, 60, 0.3)' : 'rgba(0, 255, 204, 0.18)';
                ctx.lineWidth = 0.6;
                ctx.stroke();

                curr = curr.next;
            }

            // 4. Render Kalapa Node Particles
            allNodes.forEach(node => {
                let p = project(node.x, node.y, node.z, cx, cy);
                ctx.beginPath();
                ctx.arc(p.x, p.y, node.radius * Math.min(dynamicScale, 1.3), 0, Math.PI * 2);
                ctx.fillStyle = isBrokenState && node.type === 'rock' ? '#e74c3c' : node.color;
                ctx.fill();
            });

            // 5. HUD Display
            ctx.font = '11px "JetBrains Mono", monospace';
            ctx.fillStyle = '#00ffcc';
            ctx.fillText("BODHI-PANYA RESEARCH // RANDOMIZED RE-ASSEMBLY ENGINE", 30, 40);
            ctx.fillStyle = '#95a5a6';
            ctx.fillText(`NODES: ${allNodes.length} (Ratio 4:2:1) | STATE: ${isBrokenState ? 'ANICCA (ENTROPY)' : 'NEW RE-MIX EQUILIBRIUM'}`, 30, 60);

            ctx.fillStyle = '#74b9ff';
            ctx.fillText("∫ F_spring dt = -k · x", canvas.width - 240, 40);
            ctx.fillText("lim t→∞ dS/dt > 0", canvas.width - 240, 60);

            requestAnimationFrame(renderLoop);
        }

        renderLoop();
    </script>
</body>
</html>
