<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BODHI-PANYA ENGINE // SHARP HUD TELEMETRY (v5.3D)</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --site-yellow: #f39c12;
            --site-dark: #020406;
            --text-main: #f5f6fa;
        }

        body {
            margin: 0;
            background: var(--site-dark);
            font-family: 'Sarabun', sans-serif;
            color: var(--text-main);
            overflow: hidden;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .engine-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 30%, #0a111c 0%, #020406 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <div class="engine-container">
        <canvas id="panyaCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('panyaCanvas');
        const ctx = canvas.getContext('2d');

        // ฟังก์ชันปรับสเกล HiDPI / Retina เพื่อความคมชัดสูงสุดของตัวหนังสือและเส้น
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        class BodhiNode3D {
            constructor(x, y, z, type) {
                this.ox = x; this.oy = y; this.oz = z;
                this.targetX = x; this.targetY = y; this.targetZ = z;
                this.x = x; this.y = y; this.z = z;
                this.vx = 0; this.vy = 0; this.vz = 0;
                this.type = type;
                
                if (type === 'rock') {
                    this.radius = 6.0 + Math.random() * 2.5;
                    this.baseColor = '#00ffff';
                } else if (type === 'sand') {
                    this.radius = 2.5 + Math.random() * 1.2;
                    this.baseColor = '#ff007f';
                } else if (type === 'root') {
                    this.radius = 8.0;
                    this.baseColor = '#ffffff';
                } else {
                    this.radius = 1.1;
                    this.baseColor = '#a29bfe';
                }

                this.next = null;
                this.isBroken = false;
            }

            randomizeNewHome() {
                let size = 85;
                this.targetX = (Math.random() - 0.5) * size;
                this.targetY = (Math.random() - 0.5) * size;
                this.targetZ = (Math.random() - 0.5) * size;
                this.vx = 0; this.vy = 0; this.vz = 0;
                this.isBroken = false;
            }

            updateHome() {
                this.ox = this.targetX;
                this.oy = this.targetY;
                this.oz = this.targetZ;
            }
        }

        let rootNode = null;
        let allNodes = [];
        let idleAngle = 0;
        let dynamicScale = 1.0;
        let isBrokenState = false;

        let lastTime = performance.now();
        let fps = 60;
        let frameTime = 16.6;

        function buildBodhiTree() {
            allNodes = [];
            let size = 90;
            let step = 15;

            rootNode = new BodhiNode3D(0, -size/2, 0, 'root');
            allNodes.push(rootNode);

            let lastCreated = rootNode;

            for (let x = -size/2; x <= size/2; x += step) {
                for (let y = -size/2; y <= size/2; y += step) {
                    for (let z = -size/2; z <= size/2; z += step) {
                        if (x === 0 && y === -size/2 && z === 0) continue;

                        let roll = Math.random() * 7;
                        let type = 'paste';
                        if (roll < 4) type = 'rock';
                        else if (roll < 6) type = 'sand';

                        if (Math.random() > 0.1) {
                            let newNode = new BodhiNode3D(x, y, z, type);
                            allNodes.push(newNode);

                            lastCreated.next = newNode;
                            lastCreated = newNode;
                        }
                    }
                }
            }
        }

        function computeScaleMatrix() {
            const logicalWidth = window.innerWidth;
            const logicalHeight = window.innerHeight;
            const minDim = Math.min(logicalWidth, logicalHeight);
            dynamicScale = (minDim / 400) * 0.85;
            return dynamicScale;
        }

        function project(x, y, z, cx, cy) {
            let rad = idleAngle;
            let cos = Math.cos(rad);
            let sin = Math.sin(rad);

            let x1 = x * cos - z * sin;
            let z1 = z * cos + x * sin;
            let y1 = y;

            let scaledX = x1 * dynamicScale;
            let scaledY = y1 * dynamicScale;
            let scaledZ = z1 * dynamicScale;

            let isoX = cx + (scaledX - scaledZ) * 0.707;
            let isoY = cy + (scaledX + scaledZ) * 0.353 + scaledY;

            return { x: isoX, y: isoY };
        }

        function triggerHammerImpact(clickX, clickY) {
            isBrokenState = true;
            let logicalWidth = window.innerWidth;
            let logicalHeight = window.innerHeight;
            let cx = logicalWidth / 2;
            let cy = logicalHeight / 2;

            allNodes.forEach(node => {
                let dx = node.x * dynamicScale - (clickX - cx);
                let dy = node.y * dynamicScale - (clickY - cy);
                let dist = Math.hypot(dx, dy);

                let powerMultiplier = 16;
                node.vx += (dx / (dist + 5)) * (Math.random() * powerMultiplier + 3) + (Math.random() - 0.5) * 8;
                node.vy += (dy / (dist + 5)) * (Math.random() * powerMultiplier + 3) + (Math.random() - 0.5) * 8;
                node.vz += (Math.random() - 0.5) * 10;
                node.isBroken = true;
            });

            setTimeout(() => {
                reconstituteNewMix();
            }, 3500);
        }

        function reconstituteNewMix() {
            allNodes.forEach(node => {
                node.randomizeNewHome();
                node.updateHome();
            });
            isBrokenState = false;
        }

        canvas.addEventListener('click', (e) => {
            if (!isBrokenState) {
                // คำนวณพิกัดคลิกตาม Logical Coordinates
                const rect = canvas.getBoundingClientRect();
                triggerHammerImpact(e.clientX - rect.left, e.clientY - rect.top);
            }
        });

        buildBodhiTree();
        computeScaleMatrix();

        function renderLoop(currentTime) {
            frameTime = currentTime - lastTime;
            lastTime = currentTime;
            if (frameTime > 0) {
                fps = Math.round(1000 / frameTime);
            }

            const logicalWidth = window.innerWidth;
            const logicalHeight = window.innerHeight;

            ctx.clearRect(0, 0, logicalWidth, logicalHeight);
            let cx = logicalWidth / 2;
            let cy = logicalHeight / 2;

            if (!isBrokenState) {
                idleAngle += 0.005;
            }

            computeScaleMatrix();

            // 1. Flat Projected Shadows
            allNodes.forEach(node => {
                let p = project(node.x, node.y, node.z, cx, cy);
                let shadowY = cy + (80 * dynamicScale);
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
                ctx.beginPath();
                ctx.ellipse(p.x, shadowY + (p.y - cy) * 0.15, node.radius * dynamicScale * 1.2, node.radius * dynamicScale * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();
            });

            // 2. Calculus Dynamics Update
            allNodes.forEach(node => {
                if (isBrokenState) {
                    node.x += node.vx;
                    node.y += node.vy;
                    node.z += node.vz;
                    node.vy += 0.35;
                    node.vx *= 0.94;
                    node.vy *= 0.94;

                    let p = project(node.x, node.y, node.z, cx, cy);
                    if (p.x < 20 || p.x > logicalWidth - 20) node.vx *= -0.3;
                    if (p.y < 20 || p.y > logicalHeight - 20) node.vy *= -0.3;
                } else {
                    node.x += (node.ox - node.x) * 0.1;
                    node.y += (node.oy - node.y) * 0.1;
                    node.z += (node.oz - node.z) * 0.1;
                }
            });

            // 3. Render Sharp Wireframe Bonds
            let curr = rootNode;
            while (curr && curr.next) {
                let p1 = project(curr.x, curr.y, curr.z, cx, cy);
                let p2 = project(curr.next.x, curr.next.y, curr.next.z, cx, cy);

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = isBrokenState ? 'rgba(255, 0, 127, 0.65)' : 'rgba(0, 255, 255, 0.45)';
                ctx.lineWidth = 1.0;
                ctx.stroke();

                curr = curr.next;
            }

            // 4. Render True 3D Spherical Shading
            allNodes.forEach(node => {
                let p = project(node.x, node.y, node.z, cx, cy);
                let r = node.radius * Math.min(dynamicScale, 1.3);

                let gradient = ctx.createRadialGradient(
                    p.x - r * 0.35, p.y - r * 0.35, r * 0.1,
                    p.x, p.y, r
                );
                
                let mainColor = isBrokenState && node.type === 'rock' ? '#ff0055' : node.baseColor;
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.4, mainColor);
                gradient.addColorStop(1, '#020406');

                ctx.beginPath();
                ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.shadowColor = mainColor;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // 5. จัดระเบียบ HUD Typography แยกบรรทัดชัดเจน ไม่ซ้อนทับกัน
            ctx.font = '11px "JetBrains Mono", monospace';
            
            // โซนบนซ้าย: ข้อมูลระบบ (แยกเป็น 2 บรรทัดชัดเจน)
            ctx.textAlign = 'left';
            ctx.fillStyle = '#00ffff';
            ctx.fillText("BODHI-PANYA RESEARCH // 3D SHADING SHARP MATRIX", 30, 35);
            ctx.fillStyle = '#a29bfe';
            ctx.fillText(`NODES: ${allNodes.length} (Ratio 4:2:1) | STATE: ${isBrokenState ? 'ANICCA (ENTROPY)' : 'COSMIC EQUILIBRIUM'}`, 30, 55);

            // โซนบนขวา: สมการทางคณิตศาสตร์ (แยกเป็น 2 บรรทัดชัดเจน ชิดขวา)
            ctx.textAlign = 'right';
            ctx.fillStyle = '#74b9ff';
            ctx.fillText("∫ F_spring dt = -k · x", logicalWidth - 30, 35);
            ctx.fillText("lim t→∞ dS/dt > 0", logicalWidth - 30, 55);

            // โซนล่างซ้าย: Performance Telemetry (FPS & Frame Time)
            ctx.textAlign = 'left';
            ctx.fillStyle = '#f39c12';
            ctx.fillText(`FPS: ${fps} | FRAME TIME: ${frameTime.toFixed(1)}ms`, 30, logicalHeight - 30);

            requestAnimationFrame(renderLoop);
        }

        requestAnimationFrame(renderLoop);
    </script>
</body>
</html>
